name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        working-directory: pokemon-pack-opener
        run: |
          set +e
          gradle build --no-daemon > build.log 2>&1
          code=$?
          echo "=========== ERRORS ==========="
          grep -n -A6 "error:" build.log || tail -n 60 build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-pack-opener-jar
          path: pokemon-pack-opener/build/libs/*.jar
