name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        id: build
        continue-on-error: true
        working-directory: pokemon-pack-opener
        run: gradle build --no-daemon > ../build.log 2>&1
      - name: Save log
        if: always()
        run: |
          cp build.log /tmp/build.log
          git config user.name bot
          git config user.email bot@example.com
          git checkout --orphan buildlog
          git rm -rf . -q
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "log" -q
          git push -f origin buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-pack-opener-jar
          path: pokemon-pack-opener/build/libs/*.jar
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
